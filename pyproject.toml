[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sanjeevani"
version = "0.1.0"
description = "AI-IoT drone network for emergency medical response in rural and remote areas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["healthcare", "drones", "iot", "triage", "telemedicine", "emergency"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
sanjeevani = "sanjeevani.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
